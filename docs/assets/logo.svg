<svg viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SkillStack logo">
    <title>SkillStack</title>
    <desc>SkillStack wordmark: four stacked rectangles forming an S-shape next to the word SkillStack.</desc>

    <!-- Logo mark: four stacked rounded rectangles forming an "S" shape.
         Top and bottom bars span the full width (the two horizontal strokes
         of an S); the two middle bars alternate left and right to suggest
         the curve. Palette: deep blue #1e3a8a + accent orange #f97316. -->
    <g shape-rendering="geometricPrecision">
        <!-- Top horizontal stroke (full width). -->
        <rect x="8" y="9" width="34" height="7" rx="2" fill="#1e3a8a"/>
        <!-- Upper-middle stroke, left-aligned (narrower). -->
        <rect x="8" y="19" width="22" height="7" rx="2" fill="#f97316"/>
        <!-- Lower-middle stroke, right-aligned (narrower). -->
        <rect x="20" y="29" width="22" height="7" rx="2" fill="#f97316"/>
        <!-- Bottom horizontal stroke (full width). -->
        <rect x="8" y="39" width="34" height="7" rx="2" fill="#1e3a8a"/>
    </g>

    <!-- Wordmark. "Skill" in deep blue, "Stack" in orange.
         Vertically centered on the logo mark (which spans y=9..46, center y=27.5). -->
    <text x="52" y="27.5"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="22"
          font-weight="700"
          fill="#1e3a8a"
          dominant-baseline="central"
          text-rendering="geometricPrecision">Skill
        <tspan fill="#f97316">Stack</tspan>
    </text>
</svg>
